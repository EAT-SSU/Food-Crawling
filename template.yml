AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Food Scrapper Serverless Application

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Timeout: 300
    MemorySize: 512

Parameters:
  GPTApiKey:
    Type: String
    NoEcho: true
  SlackWebhookUrl:
    Type: String
    NoEcho: true
  ApiBaseUrl:
    Type: String
  DevApiBaseUrl:
    Type: String
  DormitoryRelayUrl:
    Type: String
    Default: ""
  DormitoryRelayToken:
    Type: String
    NoEcho: true
    Default: ""

Resources:
  PythonRequirementsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-python-requirements"
      Description: Python requirements layer
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.11
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: python3.11
      BuildArchitecture: arm64

  # One function for every restaurant; the schedule input selects the work.
  MenuFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: functions.handler.lambda_handler
      Environment:
        Variables:
          GPT_API_KEY: !Ref GPTApiKey
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
          API_BASE_URL: !Ref ApiBaseUrl
          DEV_API_BASE_URL: !Ref DevApiBaseUrl
          DORMITORY_RELAY_URL: !Ref DormitoryRelayUrl
          DORMITORY_RELAY_TOKEN: !Ref DormitoryRelayToken
      Layers:
        - !Ref PythonRequirementsLayer
      Events:
        DormitoryAt0800:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 8 ? * * *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"DORMITORY","dates":"current_week","final":false,"environments":["dev","prod"]}'
        DormitoryAt0900:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 9 ? * * *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"DORMITORY","dates":"current_week","final":false,"environments":["dev","prod"]}'
        DormitoryAt1000:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 10 ? * * *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"DORMITORY","dates":"current_week","final":true,"environments":["dev","prod"]}'
        HaksikNextWeek:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 16 ? * SUN *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"HAKSIK","dates":"next_week","final":false,"environments":["dev","prod"]}'
        HaksikNextWeekFinal:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 20 ? * SUN *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"HAKSIK","dates":"next_week","final":true,"environments":["dev","prod"]}'
        HaksikRemainingWeek:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 16 ? * MON-THU *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"HAKSIK","dates":"remaining_week","final":true,"environments":["dev","prod"]}'
        DodamNextWeek:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 16 ? * SUN *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"DODAM","dates":"next_week","final":false,"environments":["dev","prod"]}'
        DodamNextWeekFinal:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 20 ? * SUN *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"DODAM","dates":"next_week","final":true,"environments":["dev","prod"]}'
        DodamRemainingWeek:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 16 ? * MON-THU *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"DODAM","dates":"remaining_week","final":true,"environments":["dev","prod"]}'
        FacultyNextWeek:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 16 ? * SUN *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"FACULTY","dates":"next_week","final":false,"environments":["dev","prod"]}'
        FacultyNextWeekFinal:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 20 ? * SUN *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"FACULTY","dates":"next_week","final":true,"environments":["dev","prod"]}'
        FacultyRemainingWeek:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(5 16 ? * MON-THU *)
            ScheduleExpressionTimezone: Asia/Seoul
            Input: '{"restaurant":"FACULTY","dates":"remaining_week","final":true,"environments":["dev","prod"]}'

  MenuFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: MenuFunction
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3005]
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MenuFunction}"
      RetentionInDays: 30
